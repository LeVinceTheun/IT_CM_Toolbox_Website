<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recherche d'outils de Change management pour les projets IT</title>

    <link rel="stylesheet" href="../css/global.css">

</head>

<body>

    <app-nav></app-nav>
    
    <div class="page-wrapper">
        <main>

            <h2 style="padding-left: 20px;">Recherche d'outils</h2>

            <div class="filters"  style="padding-left: 20px;">
                <h3>Filtres :</h3>
                <div id="keywordTags"></div>
            </div>

            <div class="selected-filters"  style="padding-left: 20px;">
                <h3>Filtres sélectionnés :</h3>
                <div id="selectedTags">None</div>
            </div>

            <div class="split">
                <div class="selected-filters"  style="padding-left: 20px;">
                    <h3>Nombre de résultats les plus probants à afficher :</h3>
                    <select id="resultLimit">
                        <option value="0">Tous</option>
                        <option value="3">Top 3</option>
                        <option value="5">Top 5</option>
                        <option value="10">Top 10</option>
                    </select>
                </div>
                
                <div class="selected-filters"  style="padding-left: 20px;">
                    <h3>Mode sélectionné :</h3>
                    <div class="search-mode" id="searchMode" style="padding-left: 20px;">
                        <button type="button" class="mode-btn" data-mode="strict">=</button>
                        <button type="button" class="mode-btn active" data-mode="closest">±</button>
                        <button type="button" class="mode-btn" data-mode="auto">⋕</button>
                    </div>
                    <p id="modeInfo"></p>
                </div>
            </div>

            <table id="resultsTable">

                <thead>
                    <tr>
                        <th>Outil</th>
                        <th>Description</th>
                        <th>Mot(s)-clé(s)</th>
                    </tr>
                </thead>

                <tbody></tbody>

            </table>

        </main>
    </div>
</body>

<!-- Ref JavaScript -->
<script src="../js/toolbox.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../js/navbar.js"></script> 
    
</html>
